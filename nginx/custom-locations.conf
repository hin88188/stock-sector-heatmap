# NPM Custom Locations 設定參考
#
# 使用方式：
# 1. 開啟 NPM 管理介面
# 2. 進入 Proxy Hosts → topstock.kkh.qzz.io → 編輯
# 3. 切換到 Custom Locations 頁籤
# 4. 分別加入下面兩個 location block
#
# 重要：使用 rewrite 確保 query string 完整轉發
# ============================================================

# Location 1: lbkrs.com 市場 API
# Path: /api/lbkrs
# ----------------------------------------------------------
location /api/lbkrs {
    rewrite ^/api/lbkrs(.*)$ $1 break;
    proxy_pass https://m-gl.lbkrs.com;
    proxy_set_header Host m-gl.lbkrs.com;
    proxy_set_header Accept-Language "";
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
}

# Location 2: Fear & Greed Index API
# Path: /api/feargreed
# ----------------------------------------------------------
location /api/feargreed {
    rewrite ^/api/feargreed(.*)$ $1 break;
    proxy_pass https://feargreedmeter.com;
    proxy_set_header Host feargreedmeter.com;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
}
